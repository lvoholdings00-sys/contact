<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LVO · Connect</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#8B0000;--red-hi:#CC2020;
  --chrome:#C8C8D0;--white:#F0EEEC;--dim:#666662;
  --bg:#060404;
}
html,body{min-height:100%;background:var(--bg);color:var(--white);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden;cursor:none}

/* ── SWIRL CURSOR CANVAS ── */
#canvas{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:0;
  pointer-events:none;
}

/* ── SMALL CUSTOM CURSOR ── */
.cursor-dot{
  position:fixed;top:0;left:0;
  width:7px;height:7px;border-radius:50%;
  background:var(--red-hi);
  box-shadow:0 0 6px rgba(204,32,32,0.9),0 0 14px rgba(204,32,32,0.4);
  transform:translate(-50%,-50%);
  z-index:4;pointer-events:none;
  transition:width .25s cubic-bezier(0.34,1.56,0.64,1),height .25s cubic-bezier(0.34,1.56,0.64,1),background .25s;
}
.cursor-ring{
  position:fixed;top:0;left:0;
  width:20px;height:20px;border-radius:50%;
  border:0.5px solid rgba(204,32,32,0.55);
  transform:translate(-50%,-50%);
  z-index:4;pointer-events:none;
  transition:width .3s cubic-bezier(0.34,1.56,0.64,1),height .3s cubic-bezier(0.34,1.56,0.64,1),border-color .3s,opacity .3s;
}
.cursor-dot.hover{width:5px;height:5px;background:var(--white)}
.cursor-ring.hover{width:30px;height:30px;border-color:rgba(240,238,236,0.7)}

/* Dark vignette so content stays legible over the swirl trail */
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 50% 50%, transparent 20%, rgba(6,4,4,0.78) 80%),
    radial-gradient(ellipse 100% 40% at 50% 0%,  rgba(6,4,4,0.6) 0%, transparent 60%),
    radial-gradient(ellipse 100% 40% at 50% 100%,rgba(6,4,4,0.7) 0%, transparent 60%);
}

.page{
  position:relative;z-index:2;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5rem 1.5rem 4rem;
}

/* ── HEADER ── */
.header{display:flex;flex-direction:column;align-items:center;margin-bottom:3.5rem}

.logo-ring{
  display:flex;align-items:center;justify-content:center;
  margin-bottom:1.5rem;
  opacity:0;animation:fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
}

.brand-name{
  font-family:'Cinzel',serif;font-size:clamp(1.8rem,6vw,2.6rem);
  font-weight:900;letter-spacing:0.35em;color:var(--white);
  opacity:0;animation:fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
}
.brand-tagline{
  margin-top:0.6rem;
  font-family:'Cormorant Garamond',serif;font-size:clamp(0.75rem,2vw,0.9rem);
  font-style:italic;font-weight:300;letter-spacing:0.2em;
  color:var(--dim);
  opacity:0;animation:fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.55s forwards;
}

/* ── DIVIDER ── */
.divider{
  width:100%;max-width:380px;
  display:flex;align-items:center;gap:1rem;
  margin-bottom:2.5rem;
  opacity:0;animation:fadeIn 0.8s ease 0.75s forwards;
}
.divider-line{flex:1;height:0.5px;background:linear-gradient(to right,transparent,rgba(139,0,0,0.55))}
.divider-line.right{background:linear-gradient(to left,transparent,rgba(139,0,0,0.55))}
.divider-dot{width:4px;height:4px;border-radius:50%;background:var(--red-hi);opacity:0.7}

/* ── LINKS ── */
.links{width:100%;max-width:420px;display:flex;flex-direction:column;gap:0.6rem}

.social-link{
  display:flex;align-items:center;
  text-decoration:none;
  padding:0.95rem 1.4rem;
  border:0.5px solid rgba(139,0,0,0.2);
  background:rgba(6,4,4,0.55);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  position:relative;overflow:hidden;
  opacity:0;
  cursor:none;
  /* bouncy entrance — cubic-bezier with overshoot */
  animation:bouncyUp 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;
  transition:border-color 0.35s,background 0.35s,transform 0.25s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.35s;
}
/* staggered delays */
.social-link:nth-child(1){animation-delay:0.9s}
.social-link:nth-child(2){animation-delay:1.0s}
.social-link:nth-child(3){animation-delay:1.1s}
.social-link:nth-child(4){animation-delay:1.2s}
.social-link:nth-child(5){animation-delay:1.3s}
.social-link:nth-child(6){animation-delay:1.4s}

/* Left-sweep glow on hover */
.social-link::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(139,0,0,0.12) 0%,transparent 65%);
  transform:scaleX(0);transform-origin:left;
  transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);
}
.social-link:hover{
  border-color:rgba(204,32,32,0.5);
  background:rgba(12,4,4,0.75);
  /* bouncy lift on hover */
  transform:translateY(-3px) scale(1.012);
  box-shadow:0 8px 32px rgba(139,0,0,0.18), 0 2px 8px rgba(0,0,0,0.5);
}
.social-link:hover::after{transform:scaleX(1)}
.social-link:active{
  transform:translateY(0px) scale(0.99);
  transition-duration:0.1s;
}

/* Platform icon badge */
.platform-badge{
  width:34px;height:34px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-right:1.1rem;position:relative;z-index:1;
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  border:0.5px solid rgba(255,255,255,0.06);
}
.social-link:hover .platform-badge{transform:scale(1.15) rotate(-3deg)}
.platform-badge svg{width:16px;height:16px;fill:currentColor}

.badge-ig{background:#1a0d0d;color:#d9a0a0}
.badge-x {background:#0d0d14;color:#a0a8d9}
.badge-tt{background:#0d1a14;color:#a0d9b8}
.badge-li{background:#0d1220;color:#80a8d9}
.badge-fb{background:#0d1220;color:#80a8d9}
.badge-yt{background:#1a0808;color:#e06060}

.link-info{flex:1;position:relative;z-index:1}
.link-platform{
  font-family:'Cinzel',serif;font-size:0.62rem;
  letter-spacing:0.28em;color:var(--chrome);
  text-transform:uppercase;display:block;
  transition:color 0.3s;
}
.social-link:hover .link-platform{color:var(--white)}
.link-handle{
  font-size:0.78rem;font-style:italic;
  color:var(--dim);display:block;margin-top:0.1rem;
  transition:color 0.3s;
}
.social-link:hover .link-handle{color:rgba(200,200,208,0.8)}

.link-arrow{
  position:relative;z-index:1;
  font-size:0.85rem;color:var(--red-hi);
  opacity:0;transform:translateX(-6px);
  transition:opacity 0.3s,transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
.social-link:hover .link-arrow{opacity:1;transform:translateX(0)}

/* ── FOOTER ── */
.footer{
  display:flex;flex-direction:column;align-items:center;
  gap:1.2rem;margin-top:3rem;
  opacity:0;animation:fadeIn 0.8s ease 1.7s forwards;
}
.back-link{
  font-family:'Cinzel',serif;font-size:0.5rem;
  letter-spacing:0.35em;color:var(--dim);
  text-decoration:none;text-transform:uppercase;
  transition:color 0.3s;
  cursor:none;
}
.back-link:hover{color:var(--chrome)}
.copy{
  font-family:'Cinzel',serif;font-size:0.42rem;
  letter-spacing:0.16em;color:rgba(102,102,98,0.4);
}

/* ── ANIMATIONS ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to  {opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0}to{opacity:1}
}
/* Bouncy entrance — goes slightly past then settles */
@keyframes bouncyUp{
  0%  {opacity:0;transform:translateY(28px) scale(0.96)}
  60% {opacity:1;transform:translateY(-5px) scale(1.015)}
  80% {transform:translateY(2px) scale(0.998)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

@media(max-width:480px){
  .page{padding:3.5rem 1rem 3rem}
  .social-link{padding:0.85rem 1rem}
  .platform-badge{width:30px;height:30px;margin-right:0.85rem}
}
</style>

<script>
/* ─────────────────────────────────────────────
   Swirl trail cursor — vanilla-JS port of the
   useCanvasCursor hook (rope/spring line trails
   following the pointer, rendered with an
   hsla rainbow stroke on a 2D canvas).
───────────────────────────────────────────── */
(function(){
  const pos = { x: 0, y: 0 };
  let lines = [];
  let ctx, f;

  const E = {
    debug: true,
    friction: 0.5,
    trails: 20,
    size: 50,
    dampening: 0.25,
    tension: 0.98,
  };

  function Oscillator(options){
    this.phase = options.phase || 0;
    this.offset = options.offset || 0;
    this.frequency = options.frequency || 0.001;
    this.amplitude = options.amplitude || 1;
  }
  Oscillator.prototype.update = function(){
    this.phase += this.frequency;
    return this.offset + Math.sin(this.phase) * this.amplitude;
  };

  function Node(){
    this.x = 0;
    this.y = 0;
    this.vy = 0;
    this.vx = 0;
  }

  function Line(options){
    this.spring = options.spring + 0.1 * Math.random() - 0.02;
    this.friction = E.friction + 0.01 * Math.random() - 0.002;
    this.nodes = [];
    for (let i = 0; i < E.size; i++){
      const n = new Node();
      n.x = pos.x;
      n.y = pos.y;
      this.nodes.push(n);
    }
  }

  Line.prototype.update = function(){
    let spring = this.spring;
    let node = this.nodes[0];
    node.vx += (pos.x - node.x) * spring;
    node.vy += (pos.y - node.y) * spring;
    for (let i = 0, len = this.nodes.length; i < len; i++){
      node = this.nodes[i];
      if (i > 0){
        const prevNode = this.nodes[i - 1];
        node.vx += (prevNode.x - node.x) * spring;
        node.vy += (prevNode.y - node.y) * spring;
        node.vx += prevNode.vx * E.dampening;
        node.vy += prevNode.vy * E.dampening;
      }
      node.vx *= this.friction;
      node.vy *= this.friction;
      node.x += node.vx;
      node.y += node.vy;
      spring *= E.tension;
    }
  };

  Line.prototype.draw = function(){
    let x = this.nodes[0].x;
    let y = this.nodes[0].y;
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let i = 1, len = this.nodes.length - 2; i < len; i++){
      const node = this.nodes[i];
      const nextNode = this.nodes[i + 1];
      x = (node.x + nextNode.x) * 0.5;
      y = (node.y + nextNode.y) * 0.5;
      ctx.quadraticCurveTo(node.x, node.y, x, y);
    }
    const node = this.nodes[this.nodes.length - 2];
    const nextNode = this.nodes[this.nodes.length - 1];
    ctx.quadraticCurveTo(node.x, node.y, nextNode.x, nextNode.y);
    ctx.stroke();
    ctx.closePath();
  };

  function onMove(e){
    if (e.touches){
      pos.x = e.touches[0].clientX;
      pos.y = e.touches[0].clientY;
    } else {
      pos.x = e.clientX;
      pos.y = e.clientY;
    }
  }

  function initCursor(){
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove);
    document.addEventListener('touchstart', onMove);

    lines = [];
    for (let i = 0; i < E.trails; i++){
      lines.push(new Line({ spring: 0.4 + (i / E.trails) * 0.025 }));
    }
  }

  function resizeCanvas(){
    ctx.canvas.width = window.innerWidth;
    ctx.canvas.height = window.innerHeight;
  }

  function render(){
    if (ctx.running){
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'hsla(' + Math.round(f.update()) + ',50%,50%,0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < lines.length; i++){
        lines[i].update();
        lines[i].draw();
      }
      ctx.frame++;
    }
    window.requestAnimationFrame(render);
  }

  function renderCanvas(){
    ctx = document.getElementById('canvas').getContext('2d');
    ctx.running = true;
    ctx.frame = 1;

    f = new Oscillator({
      phase: Math.random() * 2 * Math.PI,
      amplitude: 85,
      frequency: 0.0015,
      offset: 285,
    });

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('focus', () => {
      ctx.running = true;
      render();
    });
    window.addEventListener('blur', () => {
      ctx.running = true;
    });

    resizeCanvas();
  }

  renderCanvas();
  initCursor();
  render();
})();
</script>

<!-- ── small custom cursor: dot + ring ── -->
<script>
(function(){
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  const dotPos = {x:innerWidth/2,y:innerHeight/2};
  const ringPos = {x:innerWidth/2,y:innerHeight/2};
  const target = {x:innerWidth/2,y:innerHeight/2};

  window.addEventListener('mousemove', (e) => {
    target.x = e.clientX; target.y = e.clientY;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const hover = !!(el && el.closest('a'));
    dot.classList.toggle('hover', hover);
    ring.classList.toggle('hover', hover);
  });
  window.addEventListener('touchmove', (e) => {
    if (!e.touches.length) return;
    target.x = e.touches[0].clientX; target.y = e.touches[0].clientY;
  }, {passive:true});

  function tick(){
    // dot tracks almost instantly, ring trails slightly — small, tight, no drama
    dotPos.x += (target.x - dotPos.x) * 0.5;
    dotPos.y += (target.y - dotPos.y) * 0.5;
    ringPos.x += (target.x - ringPos.x) * 0.18;
    ringPos.y += (target.y - ringPos.y) * 0.18;

    dot.style.left = dotPos.x + 'px';
    dot.style.top  = dotPos.y + 'px';
    ring.style.left = ringPos.x + 'px';
    ring.style.top  = ringPos.y + 'px';

    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
