<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LVO · Connect</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#8B0000;--red-hi:#CC2020;--red-glow:#8B000040;
  --chrome:#C8C8D0;--white:#F0EEEC;--dim:#666662;
  --bg:#060404;--surface:#0E0808;--surface2:#160D0D;
}
html,body{min-height:100%;background:var(--bg);color:var(--white);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden}

body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 55% 45% at 50% 0%,rgba(139,0,0,0.18) 0%,transparent 70%),
    radial-gradient(ellipse 40% 30% at 50% 100%,rgba(100,0,0,0.12) 0%,transparent 65%);
  pointer-events:none;z-index:0
}

.page{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5rem 1.5rem 4rem
}

/* ── HEADER ── */
.header{display:flex;flex-direction:column;align-items:center;margin-bottom:3.5rem}

.logo-ring{
  width:72px;height:72px;border-radius:50%;
  border:0.5px solid rgba(139,0,0,0.5);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:1.5rem;
  position:relative;
  opacity:0;animation:fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.2s forwards
}
.logo-ring::before{
  content:'';position:absolute;inset:-1px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,0,0,0.15) 0%,transparent 70%)
}
.logo-ring .monogram{
  font-family:'Cinzel',serif;font-size:1.3rem;font-weight:900;
  letter-spacing:0.1em;color:var(--red-hi);position:relative;z-index:1
}

.brand-name{
  font-family:'Cinzel',serif;font-size:clamp(1.8rem,6vw,2.6rem);
  font-weight:900;letter-spacing:0.35em;color:var(--white);
  opacity:0;animation:fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.4s forwards
}
.brand-tagline{
  margin-top:0.6rem;
  font-family:'Cormorant Garamond',serif;font-size:clamp(0.75rem,2vw,0.9rem);
  font-style:italic;font-weight:300;letter-spacing:0.2em;
  color:var(--dim);
  opacity:0;animation:fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.55s forwards
}

/* ── DIVIDER ── */
.divider{
  width:100%;max-width:380px;
  display:flex;align-items:center;gap:1rem;
  margin-bottom:2.5rem;
  opacity:0;animation:fadeIn 0.8s ease 0.75s forwards
}
.divider-line{flex:1;height:0.5px;background:linear-gradient(to right,transparent,rgba(139,0,0,0.45))}
.divider-line.right{background:linear-gradient(to left,transparent,rgba(139,0,0,0.45))}
.divider-dot{width:4px;height:4px;border-radius:50%;background:var(--red-hi);opacity:0.7}

/* ── LINKS ── */
.links{width:100%;max-width:420px;display:flex;flex-direction:column;gap:0.6rem}

.social-link{
  display:flex;align-items:center;
  text-decoration:none;
  padding:0.95rem 1.4rem;
  border:0.5px solid rgba(139,0,0,0.18);
  background:rgba(14,8,8,0.6);
  position:relative;overflow:hidden;
  opacity:0;transform:translateY(16px);
  transition:border-color 0.35s,background 0.35s;
  animation:fadeUp 0.65s cubic-bezier(0.16,1,0.3,1) forwards
}
.social-link:nth-child(1){animation-delay:0.9s}
.social-link:nth-child(2){animation-delay:1.0s}
.social-link:nth-child(3){animation-delay:1.1s}
.social-link:nth-child(4){animation-delay:1.2s}
.social-link:nth-child(5){animation-delay:1.3s}
.social-link:nth-child(6){animation-delay:1.4s}

.social-link::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(139,0,0,0.08) 0%,transparent 60%);
  transform:scaleX(0);transform-origin:left;
  transition:transform 0.4s cubic-bezier(0.16,1,0.3,1)
}
.social-link:hover{border-color:rgba(204,32,32,0.5);background:rgba(20,6,6,0.8)}
.social-link:hover::after{transform:scaleX(1)}

/* Platform icon badge */
.platform-badge{
  width:34px;height:34px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-right:1.1rem;position:relative;z-index:1;
  transition:transform 0.3s;
  border:0.5px solid rgba(255,255,255,0.06)
}
.social-link:hover .platform-badge{transform:scale(1.08)}
.platform-badge svg{width:16px;height:16px;fill:currentColor}

.badge-ig{background:#1a0d0d;color:#d9a0a0}
.badge-x{background:#0d0d14;color:#a0a8d9}
.badge-tt{background:#0d1a14;color:#a0d9b8}
.badge-li{background:#0d1220;color:#80a8d9}
.badge-fb{background:#0d1220;color:#80a8d9}
.badge-yt{background:#1a0808;color:#e06060}

.link-info{flex:1;position:relative;z-index:1}
.link-platform{
  font-family:'Cinzel',serif;font-size:0.62rem;
  letter-spacing:0.28em;color:var(--chrome);
  text-transform:uppercase;display:block;
  transition:color 0.3s
}
.social-link:hover .link-platform{color:var(--white)}
.link-handle{
  font-size:0.78rem;font-style:italic;
  color:var(--dim);display:block;margin-top:0.1rem;
  transition:color 0.3s
}
.social-link:hover .link-handle{color:rgba(200,200,208,0.8)}

.link-arrow{
  position:relative;z-index:1;
  font-size:0.85rem;color:var(--red-hi);
  opacity:0;transform:translateX(-6px);
  transition:opacity 0.3s,transform 0.3s
}
.social-link:hover .link-arrow{opacity:1;transform:translateX(0)}

/* ── FOOTER ── */
.footer{
  display:flex;flex-direction:column;align-items:center;
  gap:1.2rem;margin-top:3rem;
  opacity:0;animation:fadeIn 0.8s ease 1.7s forwards
}
.back-link{
  font-family:'Cinzel',serif;font-size:0.5rem;
  letter-spacing:0.35em;color:var(--dim);
  text-decoration:none;text-transform:uppercase;
  transition:color 0.3s
}
.back-link:hover{color:var(--chrome)}
.copy{
  font-family:'Cinzel',serif;font-size:0.42rem;
  letter-spacing:0.16em;color:rgba(102,102,98,0.4)
}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

@media(max-width:480px){
  .page{padding:3.5rem 1rem 3rem}
  .social-link{padding:0.85rem 1rem}
  .platform-badge{width:30px;height:30px;margin-right:0.85rem}
}
</style>
</head>
